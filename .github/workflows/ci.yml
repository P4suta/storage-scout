name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NJUTEST_REV: 1c652909e0fafaf5cf418230d033bacff14c393a

jobs:
  quality:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Structural gates
        run: cargo xtask gates
      - name: Test all targets with nextest
        run: cargo nextest run --workspace --all-targets --profile ci
      - name: Test documentation
        run: cargo test --workspace --doc
      - name: Host report
        run: cargo run --quiet --package storage-scout -- doctor --json > doctor-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctor-${{ matrix.os }}
          path: doctor-${{ matrix.os }}.json
          if-no-files-found: warn

  sharing:
    name: sharing on ${{ matrix.filesystem }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        filesystem: [btrfs, xfs]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Mount a volume that shares blocks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs xfsprogs
          truncate -s 2G "$RUNNER_TEMP/volume.img"
          case "${{ matrix.filesystem }}" in
            btrfs) mkfs.btrfs -q "$RUNNER_TEMP/volume.img" ;;
            xfs) mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/volume.img" ;;
          esac
          sudo mkdir -p /mnt/share
          sudo mount -o loop "$RUNNER_TEMP/volume.img" /mnt/share
          sudo chown "$(id -u):$(id -g)" /mnt/share
          rsync -a --exclude target ./ /mnt/share/repo/
      - name: Share identical files on it
        working-directory: /mnt/share/repo
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          STORAGE_SCOUT_REQUIRE_SHARING: "1"
        run: cargo nextest run --package storage-scout --test dedupe --profile ci

  mutation:
    name: mutants ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install rust-mutants
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          cargo +1.98.0 install \
            --git https://github.com/P4suta/njutest \
            --rev ${{ env.NJUTEST_REV }} \
            --locked rust-mutants-cli
      - run: cargo fetch --locked
      - run: rust-mutants doctor
      - name: Measure this part of the catalog
        run: rust-mutants run --shard ${{ matrix.shard }}/4 --locked --offline
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: reports/mutation/
          if-no-files-found: error

  mutation-verdict:
    name: mutants verdict
    runs-on: ubuntu-latest
    needs: [mutation]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install rust-mutants
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          cargo +1.98.0 install \
            --git https://github.com/P4suta/njutest \
            --rev ${{ env.NJUTEST_REV }} \
            --locked rust-mutants-cli
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-shard-*
          path: reports/mutation/
          merge-multiple: true
      - name: Put the parts back together
        run: rust-mutants merge --runs '*'
      - name: One page showing every survivor in place
        run: rust-mutants report --format html
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/

  assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install njutest
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          cargo +1.98.0 install \
            --git https://github.com/P4suta/njutest \
            --rev ${{ env.NJUTEST_REV }} \
            --locked njutest-cli
      - run: njutest doctor
      - name: Verify
        run: njutest verify --ui=plain
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: njutest-reports
          path: |
            reports/
            .njutest/

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - run: cargo llvm-cov nextest --workspace --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: lcov.info

  msrv:
    name: minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  pure:
    name: decision core builds without std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --package storage-scout-core --target thumbv7em-none-eabi

  cross-check:
    name: check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --target ${{ matrix.target }} -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
