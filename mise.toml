min_version = "2026.10.11"

[tools]
rust = { version = "1.99.1", profile = "minimal", components = [
  "rustfmt",
  "clippy",
  "rust-src",
  "llvm-tools",
], targets = [
  "thumbv7em-none-eabi",
] }
just = "1.58.0"
typos = "1.51.1"
taplo = "0.10.0"
actionlint = "1.7.12"
lefthook = "2.2.2"
zizmor = "1.31.1"
"cargo:cargo-nextest" = "0.9.149"
"cargo:cargo-deny" = "0.20.2"
"cargo:P4suta/OComment" = { version = "rev:e3e98c77a0d0fbdeabdd90ccbfaa6620d6d1c410", crate = "ocomment", bin = "ocomment", install_env = { RUSTUP_TOOLCHAIN = "1.99.1" } }

[tasks.assure]
description = "Source-bound Kani proofs, rejected probe, Quint/TLA+ replay, fuzz, and Miri"
tools = { "cargo:kani-verifier" = "0.68.0", "github:Z3Prover/z3" = "z3-5.1.0", "npm:@informalsystems/quint" = "0.32.0", "cargo:cargo-fuzz" = "0.13.2", node = "26.11.1", java = "temurin-25.0.4+101.0.LTS" }
run = ["cargo kani setup", "cargo xtask assure"]

[tasks."assure:inventory"]
description = "Reject unassessed public decisions and missing assurance inputs"
run = "cargo xtask assurance-inventory"


[tasks.fmt]
description = "Format the workspace"
run = "cargo fmt"

[tasks."fmt:check"]
description = "Fail if anything is unformatted"
run = "cargo fmt --check"

[tasks.clippy]
description = "Lint every target with the workspace's strict lint set"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.gates]
description = "Structural rules: no comments, confined APIs, unsafe only in platform"
run = "cargo xtask gates"

[tasks.pure]
description = "Prove the decision core cannot do I/O by building it for bare metal"
run = "cargo build --package storage-scout-core --target thumbv7em-none-eabi"

[tasks.test]
description = "Run every test on this host"
run = "cargo nextest run --workspace --all-targets"

[tasks."test:doc"]
description = "Run documentation tests"
run = "cargo test --workspace --doc"

[tasks.check]
description = "Fast deterministic checks on one platform"
depends = ["fmt:check", "clippy", "gates", "pure", "test", "test:doc", "lint:repo"]

[tasks."lint:repo"]
description = "Spelling, TOML formatting, and the workflows"
run = [
  "typos",
  "taplo fmt --check",
  "actionlint",
  "zizmor --no-progress .github/workflows",
  "ocomment check --config .ocomment.toml --format github .",
]

[tasks.dependencies]
description = "Check dependency advisories, sources, bans, and licenses"
run = "cargo deny check"

[tasks."renovate:check"]
description = "Validate the resolved shared dependency-update policy"
run = "cargo xtask renovate-validate"

[tasks."renovate:extract"]
description = "Inspect dependency extraction without publishing branches or pull requests"
run = "cargo xtask renovate-extract"

[tasks.doctor]
description = "Show what this host resolved: protected areas, gates, free space"
run = "cargo run --quiet --package storage-scout -- doctor"

[tasks.explain]
description = "Account for one path: mise run explain -- <PATH>"
run = "cargo run --quiet --package storage-scout -- explain"

[tasks.coverage]
description = "Line coverage over the whole suite"
run = "cargo llvm-cov nextest --workspace --html"

[tasks.mutants]
description = "Run upstream mutation testing over the cleanup safety contract"
run = "mise run mutants:tool"

[tasks."mutants:tool"]
description = "Run pinned cargo-mutants with owned scratch and checked results"
tools = { "cargo:cargo-mutants" = "27.1.0" }
run = "cargo xtask mutants"

[tasks."mutants:dry"]
description = "List the mutation catalog without building or executing mutants"
run = "mise run mutants:tool -- --list --json"

[tasks."schema:bless"]
description = "Record newly added JSON fields after reviewing the diff"
run = "STORAGE_SCOUT_BLESS_SCHEMA=1 cargo test --package storage-scout --test schema_v3"

[tasks.cross]
description = "Type-check the targets this host is not"
run = """
for target in x86_64-pc-windows-msvc aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
  echo "== $target"
  cargo clippy --workspace --target "$target" -- -D warnings || exit 1
done
"""

[tasks.install]
description = "Install the binary from this checkout"
run = "cargo install --locked --path crates/cli"
