[[modules]]
path = "crates/core/src/managed.rs"
symbols = ["Clearance::id", "Clearance::resource", "clear", "version_reference"]
harnesses = [
  "proofs::managed_removal_requires_current_complete_unreferenced_reinstallable_evidence",
  "proofs::concrete_version_requests_preserve_their_exact_installation",
  "proofs::version_normalization_removes_only_one_optional_ascii_prefix",
]
domain = "All managed resource, reference, completeness, tier, and review states. Reflexivity covers every 16-byte sequence in the production matcher. A separate production-normalizer proof covers every 17-byte sequence, including an optional ASCII v plus 16 payload bytes. The UTF-8 API delegates to these functions. Grammar and version-prefix matching additionally require corpus replay and bounded fuzzing. Native manager and engine APIs remain external trust assumptions checked by adapter tests."

