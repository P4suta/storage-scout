[profile.default]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci]
fail-fast = false
retries = 0
failure-output = "immediate-final"
status-level = "all"
slow-timeout = { period = "30s", terminate-after = 2 }
junit.path = "target/nextest/ci/junit.xml"

[[profile.ci.overrides]]
filter = "test(/^cli_/)"
slow-timeout = { period = "120s", terminate-after = 3 }
