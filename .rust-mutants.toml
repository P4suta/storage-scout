[project]
include = [
  "crates/core/src/**/*.rs",
  "crates/cli/src/apply.rs",
  "crates/cli/src/apply/*.rs",
  "crates/cli/src/busy.rs",
  "crates/cli/src/measure.rs",
  "crates/cli/src/observe.rs",
  "crates/cli/src/observe/*.rs",
  "crates/cli/src/owners.rs",
  "crates/cli/src/coalesce.rs",
  "crates/cli/src/dedupe.rs",
  "crates/cli/src/dedupe/*.rs",
  "crates/cli/src/prune.rs",
  "crates/cli/src/prune/*.rs",
  "crates/cli/src/scan.rs",
  "crates/cli/src/watch.rs",
  "crates/cli/src/platform/*.rs",
]

[mutation]
operators = [
  "true-to-false",
  "false-to-true",
  "negate-condition",
  "negate-loop-condition",
  "remove-not",
  "negate-bool-method",
  "and-to-or",
  "or-to-and",
  "eq-to-neq",
  "neq-to-eq",
  "lt-to-le",
  "le-to-lt",
  "gt-to-ge",
  "ge-to-gt",
  "range-to-inclusive",
  "inclusive-to-range",
  "add-to-sub",
  "sub-to-add",
  "mul-to-div",
  "div-to-mul",
  "rem-to-mul",
  "remove-unary-minus",
  "return-default",
  "return-ok-default",
  "return-some-default",
  "return-true",
  "return-err-default",
  "ignore-question-statement",
  "delete-match-arm",
  "remove-match-guard",
  "break-to-continue",
  "continue-to-break",
  "condition-to-true",
  "condition-to-false",
]

[[mutation.expect]]
path = "crates/cli/src/busy.rs"
item = "Lease::keys"
rule = "return-default"
original = "self.held.iter().map(|(_, identity)| *identity).collect()"
reason = "the kept lock files matter only to a build that starts during removal, a race no test can stage"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/measure.rs"
item = "Tally::allocated"
rule = "le-to-lt"
original = "<="
reason = "a file always has at least one link, and the linked table counts a single-link file exactly as the unlinked sum does"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/apply/capability.rs"
item = "Authorized::new"
rule = "condition-to-true"
original = "&host::locate(&path)? == clearance.location()"
reason = "the path is the one the clearance was made from, so its location always matches; the check guards callers, not a state a run can reach"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/dedupe/capability.rs"
item = "Shareable::new"
rule = "condition-to-false"
original = "&host::locate(path)? != clearance.location()"
reason = "the path is the one the clearance was made from, so its location always matches; the check guards callers, not a state a run can reach"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/dedupe.rs"
item = "inventory_under"
rule = "condition-to-true"
original = "platform::device(&metadata) == device"
reason = "only a mount point under a candidate differs in device, and the mount tests are left out of measurement"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/dedupe.rs"
item = "settle"
rule = "condition-to-true"
original = "!held\n                .as_ref()\n                .is_some_and(|(current, _)| ptr::eq(*current, found))"
reason = "taking the same target's lease again for each pair is slower and releases it between pairs, but shares the same files"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/measure.rs"
item = "Tally::allocated"
rule = "condition-to-false"
original = "measured.links <= 1"
reason = "a file always has at least one link, and the linked table counts a single-link file exactly as the unlinked sum does"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/observe.rs"
item = "cache_tag"
rule = "condition-to-false"
original = "!entries.has_file(CACHE_TAG_NAME)"
reason = "reading a missing tag yields Invalid instead of Absent, and neither names a kind"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/observe.rs"
item = "owner_tag"
rule = "condition-to-false"
original = "!entries.has_file(crate::owners::MARKER_NAME)"
reason = "reading a missing marker yields Foreign instead of Absent, and neither names a kind"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/owners.rs"
item = "gitdir"
rule = "condition-to-false"
original = "target.is_absolute()"
reason = "joining an absolute gitdir onto its directory yields the gitdir itself"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/share_linux.rs"
item = "facts"
rule = "condition-to-true"
original = "metadata.uid() == caller()"
reason = "only another user's file differs, and tests cannot create one without privileges"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/share_linux.rs"
item = "facts"
rule = "condition-to-false"
original = "metadata.mode() & 0o111 == 0"
reason = "sharing in place never refuses an executable, so the mode it records changes nothing on this platform"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/share_linux.rs"
item = "facts"
rule = "condition-to-true"
original = "metadata.mode() & 0o111 == 0"
reason = "sharing in place never refuses an executable, so the mode it records changes nothing on this platform"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/share_linux.rs"
item = "facts"
rule = "eq-to-neq"
original = "=="
line = 100
reason = "sharing in place never refuses an executable, so the mode it records changes nothing on this platform"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/share_linux.rs"
item = "facts"
rule = "negate-condition"
original = "metadata.mode() & 0o111 == 0"
reason = "sharing in place never refuses an executable, so the mode it records changes nothing on this platform"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/share_linux.rs"
item = "dedupe"
rule = "condition-to-false"
original = "result != 0"
reason = "FIDEDUPERANGE fails only on requests the checks before it already refuse"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/share_linux.rs"
item = "share"
rule = "condition-to-false"
original = "shared == 0"
reason = "the kernel reports progress for every range it accepts, so a zero never arrives"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/unix.rs"
item = "stat_fd"
rule = "condition-to-false"
original = "result != 0"
reason = "fstat of an open descriptor does not fail"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/unix.rs"
item = "names"
rule = "condition-to-false"
original = "stream.is_null()"
reason = "fdopendir of a descriptor just opened as a directory does not fail"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/unix.rs"
item = "make_writable"
rule = "condition-to-false"
original = "wanted == stat.st_mode"
reason = "granting the owner a permission it already has changes nothing"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/unix.rs"
item = "make_writable"
rule = "condition-to-true"
original = "result == 0"
reason = "fchmod by the owner of an open directory does not fail"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/unix.rs"
item = "make_writable"
rule = "return-ok-default"
original = "if result == 0 {\n        Ok(())\n    } else {\n        Err(io::Error::last_os_error())\n    }"
reason = "fchmod by the owner of an open directory does not fail"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/unix.rs"
item = "Walk::clear"
rule = "condition-to-false"
original = "found != self.device"
reason = "only a mount point inside a tree differs in device, and the mount tests are left out of measurement"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/unix.rs"
item = "Walk::clear"
rule = "condition-to-false"
original = "stat_identity(&stat_fd(&opened).map_err(child_io)?) != stat_identity(&stat)"
reason = "a directory replaced between listing and opening is a race no test can stage"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/unix.rs"
item = "Walk::clear"
rule = "condition-to-false"
original = "self.keep.contains(&stat_identity(&stat))"
reason = "the kept lock files matter only to a build that starts during removal, a race no test can stage"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/unix.rs"
item = "open_root"
rule = "condition-to-false"
original = "from != to"
reason = "only a mount point differs in device from its parent, and the mount tests are left out of measurement"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/unix.rs"
item = "Tree::locate"
rule = "condition-to-false"
original = "device_number(stat_fd(&next)?.st_dev) != self.device"
reason = "only a mount point under a tree differs in device, and the mount tests are left out of measurement"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/unix.rs"
item = "remove_tree"
rule = "condition-to-false"
original = "stat_identity(&stat_at(parent.as_raw_fd(), &name).map_err(io)?) != expected"
reason = "a root replaced between emptying and removal is a race no test can stage"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/scan.rs"
item = "walk"
rule = "condition-to-true"
original = "contents.names.has_file(crate::owners::MARKER_NAME)"
reason = "looking for a marker in every directory finds none where there is none, so only the time changes"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/share_linux.rs"
item = "filesystem"
rule = "eq-to-neq"
original = "=="
reason = "btrfs and XFS share the same way, so taking one for the other changes nothing measured"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/share_linux.rs"
item = "signed"
rule = "return-default"
original = "value.into()"
reason = "on the btrfs volume CI measures, reading every magic as zero still finds btrfs first"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/unix.rs"
item = "links_of"
rule = "return-default"
original = "metadata.nlink()"
reason = "sharing in place never refuses a file with several names, so the count changes nothing on the platform CI measures"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/prune/capability.rs"
item = "Prunable::new"
rule = "condition-to-false"
original = "&host::locate(path)? != clearance.location()"
reason = "the path is the one the clearance was made from, so its location always matches; the check guards callers, not a state a run can reach"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/unix.rs"
item = "Tree::prune_session"
rule = "remove-match-guard"
original = "stat_identity(&again) == expected"
reason = "a session replaced between emptying it and removing it is a race no test can stage, and removing a replacement that is not empty fails anyway"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/events_linux.rs"
item = "Source::start"
rule = "condition-to-false"
original = "raw == -1"
reason = "inotify_init1 fails only when the process or the user has run out of descriptors or instances, which no test can stage"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/events_linux.rs"
item = "Source::start"
rule = "remove-unary-minus"
original = "-1"
reason = "a new descriptor is never 1, which standard output already holds"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/events_macos.rs"
item = "strings"
rule = "condition-to-false"
original = "string.is_null()"
reason = "Core Foundation refuses a short valid path only under process-wide allocation failure, which no test can stage"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/events_macos.rs"
item = "Source::start"
rule = "condition-to-false"
original = "array.is_null()"
reason = "Core Foundation refuses a small array only under process-wide allocation failure, which no test can stage"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/events_macos.rs"
item = "Source::start"
rule = "condition-to-false"
original = "stream.is_null()"
reason = "FSEvents refusing a valid stream is an operating-system failure no test can stage"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/platform/events_macos.rs"
item = "Source::start"
rule = "condition-to-false"
original = "unsafe { FSEventStreamStart(stream) } == 0"
reason = "FSEvents refusing to start a valid stream is an operating-system failure no test can stage"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/watch.rs"
item = "Session::turn"
rule = "condition-to-false"
original = "path.starts_with(&self.hooks.state)"
reason = "the state directory lies outside every selected root, so examining its event finds nothing and records nothing"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/watch.rs"
item = "Session::turn"
rule = "remove-match-guard"
original = "!refs.is_empty()"
reason = "rechecking ownership for an empty repository set visits no candidates and records nothing"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/watch.rs"
item = "Session::turn"
rule = "condition-to-true"
original = "!targets.is_empty()"
reason = "examining an empty target set walks nothing, adopts nothing and records nothing"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/watch.rs"
item = "Session::saw_with"
rule = "return-ok-default"
original = "self.follow(&directories)"
reason = "which directories are followed shows only in later filesystem events, and watcher integration targets are left out of measurement"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/watch.rs"
item = "Session::process"
rule = "negate-condition"
original = "fresh_survey"
line = 641
reason = "re-registering the same directories changes only watcher syscall cost, while missing a new directory shows only in later filesystem events left out of measurement"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/watch.rs"
item = "Session::process"
rule = "condition-to-true"
original = "fresh_survey"
line = 641
reason = "re-registering the same directories changes only watcher syscall cost, while missing a new directory shows only in later filesystem events left out of measurement"
outcome = "survived"

[[mutation.expect]]
path = "crates/cli/src/watch.rs"
item = "Session::process"
rule = "condition-to-false"
original = "fresh_survey"
line = 641
reason = "re-registering the same directories changes only watcher syscall cost, while missing a new directory shows only in later filesystem events left out of measurement"
outcome = "survived"

[[mutation.skip]]
path = "crates/cli/src/busy.rs"
lines = "225-225"
reason = "the identity of a lock file this process has just opened cannot fail to be read"

[[mutation.skip]]
path = "crates/cli/src/platform/share_linux.rs"
lines = "131-131"
reason = "FIDEDUPERANGE fails or reports a negative status only for requests the checks before it already refuse"

[[mutation.skip]]
path = "crates/cli/src/platform/share_linux.rs"
lines = "136-138"
reason = "the kernel reports a negative status only for requests the checks before it already refuse"

[[mutation.skip]]
path = "crates/cli/src/platform/share_linux.rs"
lines = "181-183"
reason = "the kernel reports progress for every range it accepts, so a zero never arrives"

[[mutation.skip]]
path = "crates/cli/src/scan.rs"
item = "drain"
reason = "a mutex is poisoned only by a thread that panics, and no scanning thread panics"

[execution]
locked = true
skip_targets = [
  "storage-scout/doc/storage_scout",
  "storage-scout/test/mount_boundary",
  "storage-scout/test/watch",
]
