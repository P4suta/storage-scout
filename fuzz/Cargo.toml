[package]
name = "storage-scout-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
storage-scout-core = { path = "../crates/core" }
storage-scout = { path = "../crates/cli" }
serde = { version = "1", features = ["derive"] }
toml = "1.1.5"

[[bin]]
name = "core_parsers"
path = "fuzz_targets/core_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "auto_policy"
path = "fuzz_targets/auto_policy.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
